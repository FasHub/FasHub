name: Refresh profile statistics

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/profile-stats.yml'
      - 'scripts/update_profile_stats.py'
      - 'tests/test_profile_stats.py'

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify statistics calculations
        run: python3 -m unittest discover -s tests -v
      - name: Refresh statistics cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_profile_stats.py --username FasHub
      - name: Commit updated profile statistics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md brand/public-stats.json assets/stat-contributions-*.svg assets/stat-commits-*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh profile statistics'
          git push
